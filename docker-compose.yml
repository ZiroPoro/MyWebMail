services:
  postgres:
    image: postgres:16-alpine
    container_name: mywebmail-db
    environment:
      POSTGRES_DB: mywebmail
      POSTGRES_USER: webmail
      POSTGRES_PASSWORD: webmail
    ports:
      - "5432:5432"
    volumes:
      - mywebmail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmail -d mywebmail"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mywebmail_pgdata:
